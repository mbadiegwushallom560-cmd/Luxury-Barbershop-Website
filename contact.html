<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Luxury Barbershop Website">
    <meta name="author" content="Shallom Mbadiegwu">
    <title>Contact Us - Luxury Barbershop</title>

    <!-- link -->
    <link rel="stylesheet" href="styles/styes.css">
</head>
<body class="contacts-container">
    <div class="contact-container">

        <span class="contact-logo">
            <img src="assets/logo.png" alt="#">
        </span>
        <h1>Contact Us</h1>
        <p>Have questions or want to schedule an appointment? Reach out to us!</p>

        <form action="submit_contact.php" method="post">

            <div class="input-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>  
            </div>

            <div class="input-group">    
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">    
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="input-group">
                <label for="address">Address:</label>
                <select id="address" name="address" required>
                    <option value="">Select Address</option>
                    <option value="lagos">Lagos</option>
                    <option value="abuja">Abuja</option>
                    <option value="portharcourt">Port Harcourt</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="input-group">
                <label for="date">Appointment date:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="input-group">    
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>    

            <div class="input-group">    

                <label for="gender" class="gender">Gender:

                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="femlae" name="femle" value="female">
                    <label for="female">female</label>
                </label>
            </div>

            <button type="submit" class="contact-btn">Submit</button>
        </form>
    </div>
</body>
</html>
